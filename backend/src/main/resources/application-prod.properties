# Activated via SPRING_PROFILES_ACTIVE=prod. Overrides only the values whose local-dev defaults
# would be unsafe in production; everything else inherits application.properties.
#
# ProductionSafetyValidator (com.docfitai.backend.config) additionally fails startup outright if
# any of these end up unsafe despite this file -- e.g. an operator forgetting to set JWT_SECRET,
# or copy-pasting the dev placeholder. This file alone is a hint; the validator is the guarantee.

# No safe default exists for this -- if JWT_SECRET is unset, the base application.properties
# default would otherwise silently apply, which ProductionSafetyValidator specifically refuses to
# allow to start.
docfitai.auth.jwt-secret=${JWT_SECRET}

# The refresh-token cookie must be HTTPS-only in production. Unlike the base file's `false`
# (correct for local plain-HTTP dev), this profile defaults to `true` -- still overridable if a
# specific deployment genuinely terminates TLS elsewhere and forwards plain HTTP internally, but
# that must be a deliberate operator choice, not this profile's default.
docfitai.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}

# No localhost default -- must be the real deployed frontend origin(s).
docfitai.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Restated explicitly (already false by default) so this file is a complete, readable picture of
# what "production" means for DocFit AI, not just a diff against a default someone has to go find.
docfitai.insurance.synthetic-demo.enabled=${DOCFIT_SYNTHETIC_INSURANCE_ENABLED:false}
docfitai.import.csv.enabled=${DOCFIT_PROVIDER_CSV_IMPORT_ENABLED:false}

# Quieter default logging in production; SQL/binding parameter logging is never enabled here.
logging.level.root=INFO
logging.level.com.docfitai=INFO
