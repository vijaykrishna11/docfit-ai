spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:docfitai}
spring.datasource.username=${POSTGRES_USER:docfitai}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Surface ResponseStatusException reasons (all hand-written, user-safe messages) to API
# consumers so the frontend can show real errors instead of generic status text. Does NOT
# expose stack traces or internal exception details.
# NOTE: Spring Boot 4 moved these from server.error.* to spring.web.error.* -- the old
# server.error.* names silently no-op (default "never") instead of failing to start, which is
# exactly what happened here until this was caught by a live E2E check, not by tests.
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

docfitai.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Actuator (CLAUDE.md 65) ---
# Explicit, not just relying on Spring Boot's default: only /actuator/health is ever exposed over
# HTTP. Never widen this to "*" (env/beans/configprops/mappings/heapdump can leak secrets/config).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Auth ---
# JWT_SECRET must be overridden (256+ bit random value) outside local dev; this default is
# intentionally labeled insecure and only satisfies HS256's minimum key length for local use.
docfitai.auth.jwt-secret=${JWT_SECRET:dev-only-insecure-secret-change-in-production-please-0123456789}
docfitai.auth.access-token-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES:15}
docfitai.auth.refresh-token-ttl-days=${REFRESH_TOKEN_TTL_DAYS:30}
# Refresh-token cookie's Secure flag: must be true in any real (HTTPS) deployment. False here
# because local dev serves the backend over plain http, where a Secure cookie would silently
# never be stored by the browser.
docfitai.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
docfitai.auth.rate-limit.max-attempts=${AUTH_RATE_LIMIT_MAX_ATTEMPTS:10}
docfitai.auth.rate-limit.window-minutes=${AUTH_RATE_LIMIT_WINDOW_MINUTES:5}

# --- Directory-data correction reports (CLAUDE.md "Rate Limit Reporting") ---
# Anonymous submission is allowed by design -- rate-limited by IP, separately from the auth
# limiter above (different abuse shape, independently tunable).
docfitai.reports.rate-limit.max-attempts=${REPORT_RATE_LIMIT_MAX_ATTEMPTS:5}
docfitai.reports.rate-limit.window-minutes=${REPORT_RATE_LIMIT_WINDOW_MINUTES:10}

# --- Insurance network evidence ---
# Freshness bands are reasonable defaults, not a contractually meaningful cutoff -- see
# docs/insurance-network-architecture.md ("Freshness policy"). Configurable, never hardcoded.
docfitai.insurance.freshness.fresh-days=${NETWORK_EVIDENCE_FRESH_DAYS:30}
docfitai.insurance.freshness.aging-days=${NETWORK_EVIDENCE_AGING_DAYS:60}
# Unset by default -- no live payer FHIR Plan-Net source is wired in out of the box. Set this
# (server-side only; never accept a URL from a request) to point FhirPlanNetConnector at a
# specific, vetted payer endpoint. See docs/insurance-network-research.md ("Connector reality check").
docfitai.insurance.fhir-plan-net.base-url=${FHIR_PLAN_NET_BASE_URL:}
docfitai.insurance.fhir-plan-net.connect-timeout-ms=${FHIR_PLAN_NET_CONNECT_TIMEOUT_MS:3000}
docfitai.insurance.fhir-plan-net.read-timeout-ms=${FHIR_PLAN_NET_READ_TIMEOUT_MS:5000}
docfitai.insurance.fhir-plan-net.max-retries=${FHIR_PLAN_NET_MAX_RETRIES:2}
# Production safety (CLAUDE.md 26-27, 62): synthetic demo network evidence must never seed
# implicitly. Defaults to false everywhere (dev, prod, and test) -- an operator must explicitly
# set DOCFIT_SYNTHETIC_INSURANCE_ENABLED=true (e.g. for a local demo) to see DemoNetworkEvidenceSeeder
# run at all. The reference payer/plan/network rows themselves (V7 migration) are harmless static
# metadata and are NOT gated -- only the fabricated per-provider evidence is.
docfitai.insurance.synthetic-demo.enabled=${DOCFIT_SYNTHETIC_INSURANCE_ENABLED:false}

# --- Provider data import (CLAUDE.md 30-31) ---
# No provider import runs as part of normal application startup, regardless of profile. NPPES
# import is triggered only via the "import" Spring profile (unchanged); CSV import is triggered
# only via docfitai.import.csv.enabled=true with an operator-configured source directory --
# never a request-supplied path.
docfitai.import.csv.enabled=${DOCFIT_PROVIDER_CSV_IMPORT_ENABLED:false}
docfitai.import.csv.source-directory=${DOCFIT_PROVIDER_CSV_SOURCE_DIR:}
docfitai.import.csv.batch-size=${DOCFIT_PROVIDER_CSV_BATCH_SIZE:200}
# Operator dry-run (CLAUDE.md "Operator Dry-Run"): parse/validate/count only, never write.
docfitai.import.csv.dry-run=${DOCFIT_PROVIDER_CSV_DRY_RUN:false}

# --- Geography reference import (CLAUDE.md "Geography Import Pipeline") ---
# Off by default. When enabled, upserts docfitai.import.geography.source-path (a Spring resource
# location -- classpath:... for the bundled, source-verified LA County reference set, or a plain
# filesystem path for an operator-supplied file) into zip_geography.
docfitai.import.geography.enabled=${DOCFIT_GEOGRAPHY_IMPORT_ENABLED:false}
docfitai.import.geography.source-path=${DOCFIT_GEOGRAPHY_SOURCE_PATH:classpath:geography/la-county-zip-geography.csv}
docfitai.import.geography.source-name=${DOCFIT_GEOGRAPHY_SOURCE_NAME:U.S. Census Bureau 2024 ZCTA Gazetteer + 2020 ZCTA-County/Place Relationship Files}
docfitai.import.geography.source-version=${DOCFIT_GEOGRAPHY_SOURCE_VERSION:2024}
# Operator dry-run (CLAUDE.md "Operator Dry-Run"): parse/validate/count only, never write.
docfitai.import.geography.dry-run=${DOCFIT_GEOGRAPHY_DRY_RUN:false}

# --- Bounded NPPES import scope (CLAUDE.md "Import Cap" / "LA County API Import Strategy") ---
# Empty by default: the importer processes every row currently in zip_geography (existing
# behavior, unchanged). Set to a comma-separated ZIP list to bound a real run to an explicit,
# calculated subset instead of the whole reference table -- never accepted from a request.
docfitai.import.nppes.zip-codes=${DOCFIT_NPPES_IMPORT_ZIP_CODES:}

# --- Operator-triggered provider refresh (CLAUDE.md "Operator-Triggerable Provider Refresh") ---
# Empty by default -- refreshes nothing. Set to a comma-separated NPI list (never accepted from a
# request) to re-fetch and re-upsert exactly those providers, via either the "refresh" CLI profile
# or the scheduler below.
docfitai.refresh.nppes.npis=${DOCFIT_REFRESH_NPIS:}

# --- Provider refresh scheduler (CLAUDE.md "Scheduler -- Default OFF") ---
# Off everywhere by default, including production, until an operator explicitly opts in --
# scheduling infrastructure itself (@EnableScheduling) is conditional on this flag, so no
# background thread pool exists at all unless enabled. Overlap-protected via a Postgres advisory
# lock (ProviderRefreshLock); a run that finds the lock already held is skipped, not queued.
docfitai.refresh.scheduler.enabled=${DOCFIT_PROVIDER_REFRESH_ENABLED:false}
docfitai.refresh.scheduler.cron=${DOCFIT_PROVIDER_REFRESH_CRON:0 0 3 * * *}
